[project]
name = "scenetest"
version = "0.1.0"
description = "Contract-driven graphics unit tests for agentic text-to-3D scene generation."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pillow>=10.0.0",
  "reportlab>=4.0.0",
  "python-pptx>=1.0.2"
]

[tool.setuptools]
packages = ["scenetest", "scenetest.agents", "scenetest.blender", "scenetest.core", "scenetest.demo", "scenetest.rendering"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
